  <main class="page" id="main">
    <a class="back-link" href="/">← Back</a>
    <section class="panel">
      <h1>Tell me what's going on</h1>
      <p class="lede">For custom projects, larger jobs, or anything that needs more than a quick call. I'll follow up with next steps or a quote.</p>

      <form class="form" action="https://forms.doolab.dev/bjd859/contact" method="post">
        <div class="form__hp" aria-hidden="true">
          <label for="website">Leave this field empty</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <div class="field">
          <label for="name">Name <span class="field__req">(required)</span></label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email <span class="field__req">(required)</span></label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="message">What do you need help with? <span class="field__req">(required)</span></label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>
        <button type="submit" class="btn">Send</button>
      </form>

      <p class="crosslink">Just need something quick? <a href="/book/">Book a call instead →</a></p>
    </section>
